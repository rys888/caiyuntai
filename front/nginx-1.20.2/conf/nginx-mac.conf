
# ============================================================
# 企业办公物资采购平台 前端运行环境 —— macOS 版 nginx 配置
# 由原「苍穹外卖」资料包的 nginx 配置改写而来
#
# 端口布局（已避开本机已被占用的端口）：
#   8082  管理端（采购专员 / 行政管理员）→ 反代到后端 /admin/**
#   8083  员工采购端（普通员工）        → 反代到后端 /user/**
#   8084  后端 Spring Boot（两个前端共用同一套服务）
#
# 为什么不用 8080 / 8081：
#   这两个端口被你正在运行的另一个项目 hm-dianping（黑马点评）占用：
#   它的 nginx 在 8080、后端 Java 在 8081。
#   为了让两个项目能同时跑，本项目整体改用 8082 / 8083 / 8084，互不干扰。
#   想改回 8080/8081 的话，先停掉 hm-dianping 即可。
#
# 用法：
#   nginx -p /Users/eason/Desktop/caiyuntai/front/nginx-1.20.2 -c conf/nginx-mac.conf
#   管理端：http://localhost:8082
#   员工端：http://localhost:8083
# 停止：
#   nginx -p /Users/eason/Desktop/caiyuntai/front/nginx-1.20.2 -c conf/nginx-mac.conf -s stop
#
# ⚠️ 目录若被改名/移动，必须先停掉旧 nginx 再用新 -p 路径启动，
#    否则 root html/... 会指向不存在的旧目录，页面报
#    "rewrite or internal redirection cycle while internally redirecting to /index.html"
#
# 改造说明：
#   - 已移除原 WebSocket 相关的 map $http_upgrade 与 /ws/ 反代（实时推送整体下线）
#   - 新增员工采购端 server 块
# ============================================================

worker_processes  1;

# 日志和 pid 都放在资料包自己的目录里，不用 sudo、不污染 /opt/homebrew
error_log  logs/error.log  notice;
pid        logs/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout  65;

    # 把临时目录固定在资料包内
    client_body_temp_path  temp/client_body_temp;
    proxy_temp_path        temp/proxy_temp;
    fastcgi_temp_path      temp/fastcgi_temp;
    uwsgi_temp_path        temp/uwsgi_temp;
    scgi_temp_path         temp/scgi_temp;

    access_log  logs/access.log;

    upstream backend_server {
        server 127.0.0.1:8084 weight=90;
    }

    # ---------------------------------------------------------
    # 管理端：采购专员 / 行政管理员
    # ---------------------------------------------------------
    server {
        # macOS 下 80 端口需要 sudo，这里用高位端口，普通用户即可启动
        listen       8082;
        server_name  localhost;

        # 管理端静态资源（已重写为与员工端一致的设计语言）
        location / {
            root   html/admin-ui;
            index  index.html index.htm;
            # 前端是单页应用，刷新子路由时回退到 index.html
            try_files $uri $uri/ /index.html;
            # 本地开发：html/js 不做强缓存，避免浏览器长期跑旧版 console.js
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # 两端共用的样式表
        location /shared/ {
            alias  html/shared/;
            expires 1h;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # 反向代理：管理端接口
        location /api/ {
            proxy_pass   http://backend_server/admin/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }

    # ---------------------------------------------------------
    # 员工采购端：普通员工（PC 浏览器）
    # ---------------------------------------------------------
    server {
        listen       8083;
        server_name  localhost;

        # 员工端静态资源
        location / {
            root   html/staff-ui;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
            # 本地开发：html/js 不做强缓存，避免浏览器长期跑旧版 app.js
            add_header Cache-Control "no-cache, must-revalidate";
        }

        # 两端共用的样式表
        location /shared/ {
            alias  html/shared/;
            expires 1h;
        }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }

        # 反向代理：员工端接口。
        # 与管理端口的关键区别就在这里：一个指向 /admin/**，一个指向 /user/**，
        # 后端仍是同一个 8084 服务，接口路径与改造完全一致。
        location /api/ {
            proxy_pass   http://backend_server/user/;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}
